name: CI

# The lanes below are selected by what a change can break rather than by what it
# touches. Two of them exist for reasons specific to this project:
#
#   - `toolchain` is the only lane that proves a template works. It compiles and
#     runs real C++ against real libuvcpp, because the failure mode a wrong
#     feature switch produces is a library built without the module — which no
#     amount of TypeScript testing can catch.
#   - `package-e2e` installs the packed tarball into an empty prefix and speaks
#     real stdio MCP to it. A published package that cannot start is not caught
#     by any test that runs from the working tree.
#   - `windows-toolchain` is `toolchain`'s Windows counterpart. It builds and
#     runs generated services with MSVC against the libuvcpp release archive,
#     because every Windows claim the local provider made was source-derived
#     until a lane ran it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'qualification' || 'feedback' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      code: ${{ steps.plan.outputs.code }}
      docs: ${{ steps.plan.outputs.docs }}
      workflows: ${{ steps.plan.outputs.workflows }}
      package: ${{ steps.plan.outputs.package }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
    steps:
      - name: Check out the caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Select verification lanes
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci/plan.mjs

  static:
    name: Static checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Validate workflow syntax and expressions
        if: needs.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Run the static gate
        if: needs.changes.outputs.code == 'true'
        run: npm run check:ci
      - name: Verify that every test project is discoverable
        if: needs.changes.outputs.code == 'true'
        run: npm run verify:test-discovery
      # Guarded on `workflows` as well as `code`, unlike the step above: a new
      # job's test step is the case this exists for, and a workflow-only change
      # classifies as `workflows` alone — the gate above would not even run.
      - name: Verify that every test run keeps the skip list
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
        run: npm run verify:reporters
      # Guarded on `code` as well, because the checker itself lives under
      # `scripts/`, which is the `code` lane: a change to the rule has to run the
      # rule, or the change that breaks it is the change that skips it.
      - name: Verify that every action is pinned to a commit
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
        run: npm run verify:actions
      # The same pair of lanes, for the same reason: the rule is about this file
      # and the checker lives under `scripts/`. This is the step that would have
      # failed on the documentation-only push whose `test` job downloaded an
      # artifact `build` never uploaded.
      - name: Verify that no lane reads an artifact its change may not build
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
        run: npm run verify:artifact-guards
      # Guarded on `docs` rather than on `workflows`, because the rule is about
      # `docs/` and not about this file — but on `code` as well, because the
      # checker lives under `scripts/`. Both halves matter here: a docs-only
      # change runs no gate at all otherwise (only the format check below), and
      # that is the change that would publish an empty page.
      - name: Verify that no docs page holds an unescaped Vue interpolation
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
        run: npm run verify:docs-interpolation
      # Guarded on `code`, which is where both the checker and the summary script
      # live, and on `workflows`, because `mutation.yml` is what runs the script and
      # what a runner change would be made in. The weekly sweep is too slow to test
      # its own reporting here, so the script is checked against fixture reports.
      - name: Verify that the sweep summary still reports what its kills rest on
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
        run: npm run verify:mutation-summary
      # Guarded on `code` alone: the duplication summary and its fixtures are both
      # under `scripts/`, and no workflow step reads the summary's output.
      - name: Verify that the duplication summary states only what it read
        if: needs.changes.outputs.code == 'true'
        run: npm run verify:static-check-report
      - name: Check formatting when no code changed
        if: needs.changes.outputs.code != 'true'
        run: npm run format:check
      - name: Upload static diagnostics
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-check-reports
          path: .cache/static-checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build package
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - run: npm run compile
      - name: Generate the derived artifacts the built lanes read
        run: npm run artifacts:tool-catalog
      - name: Upload the runtime the built lanes consume
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uvp-test-runtime
          path: |
            dist/
            docs/public/tool-catalog.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-source:
    name: Source tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Run source tests without waiting for a build
        run: npm run test:fast -- --reporter=default --reporter=blob --reporter=./scripts/lib/vitest-skipped-reporter.mjs
        env:
          VITEST_BLOB_LABEL: source
      - name: Upload source test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-source
          path: .vitest/blob/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The repository's only Windows lane, and the reason it is narrower than the
  # others.
  #
  # Everything uvp says about Windows was read out of the source rather than
  # observed: the `cl` probe in the local provider, the `C:/…` path rule in the
  # build-output parser, `detached: process.platform !== "win32"` in the process
  # runner, and the `.exe` suffix the native probe looks for. No job had ever run
  # there, so every one of those claims was `undetermined` on the platform it is
  # about.
  #
  # It runs the source projects and the two static gates over them, and nothing
  # else. Neither needs a C++ compiler or a libuvcpp install, so what this job
  # establishes is that the TypeScript half of uvp works on Windows — generation,
  # parsing, the provider's own decisions, capture and replay, plus the type and
  # lint gates those sources have to pass. A generated workspace is **not** built
  # or run here, and the job name says so rather than leaving it to be assumed:
  # that is the `toolchain` lane, on Linux, against a real libuvcpp.
  #
  # `check:fast` is here because a static gate that cannot start on Windows is a
  # gate this repository does not actually have there, and the way to find that
  # out is to run it. It stops at `check:fast`: `check:pr` adds `docs:build`,
  # `knip`, `jscpd`, `verify:pack-reproducible` and the built tests, none of which
  # has been examined for Windows.
  windows-source:
    name: Windows source gates (no C++ build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      # The static gates go first because they are the cheap signal: seconds
      # against the tests' minute, and a failure here is not worth discovering
      # after the suite has run.
      - name: Run the type and lint gates
        run: npm run check:fast
      # No `--reporter` flags, and therefore nothing to add back: the config's own
      # two reporters already name every skipped test, and a flag here would
      # replace that list (see `scripts/verify-reporters.mjs`).
      - name: Run the source projects
        run: npm run test:fast
      # No report artifact, deliberately. The `test` job merges every artifact
      # named `vitest-report-*` into one coverage run, and this lane is not part of
      # that merge — what it establishes is that these tests pass here, which the
      # job's own log shows.

  windows-toolchain:
    name: Windows MSVC toolchain (${{ matrix.windows-route }})
    needs: [changes, static]
    if: needs.changes.outputs.toolchain == 'true'
    runs-on: windows-latest
    # Both legs build Release against the archive. `ninja` names the single-
    # configuration generator the lane started with; `default` omits the
    # generator so CMake chooses the installed Visual Studio, which is
    # multi-configuration — the route the `--config` selector exists for and the
    # default a Windows user gets.
    strategy:
      fail-fast: false
      matrix:
        windows-route: ["ninja", "default"]
    env:
      UVP_WINDOWS_GENERATOR: ${{ matrix.windows-route }}
    # The archive is a download rather than a source build, so the cost is the
    # suite: six generated workspaces, each configured and compiled by MSVC.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Install libuvcpp from the MSVC release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin the version rather than resolving "latest": this lane's claim is
          # about a release whose asset names and layout were inspected, and a
          # moving tag would silently change what the claim covers.
          $version = '1.7.0'
          $archive = "libuvcpp-$version-msvc-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri "https://github.com/Antruly/libuvcpp/releases/download/v$version/$archive" -OutFile $zip

          # The release asset is the one external binary this lane trusts. Pin its
          # digest beside the tag so a replaced, partial, or otherwise different
          # download fails here rather than being unpacked and compiled. The value
          # is what the release API reports for this asset and what a local download
          # on 2026-10-17 reproduced:
          #   gh api repos/Antruly/libuvcpp/releases/tags/v1.7.0 \
          #     --jq '.assets[] | select(.name=="libuvcpp-1.7.0-msvc-x64.zip") | .digest'
          $expectedDigest = '9b7b5daedc23420494d60348b20939b97fe2c947df3e5bbb3fbd2cd93b3e153b'
          $actualDigest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "the libuvcpp archive digest changed: expected $expectedDigest, got $actualDigest"
          }
          Write-Host "libuvcpp archive sha256: $actualDigest"

          $extract = Join-Path $env:RUNNER_TEMP 'libuvcpp-extract'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract

          $prefix = Join-Path $env:RUNNER_TEMP 'uvcpp-prefix'
          if (Test-Path $prefix) { Remove-Item -Recurse -Force $prefix }
          Move-Item -LiteralPath (Join-Path $extract "libuvcpp-$version-msvc-x64") -Destination $prefix

          # Record what the archive actually provides rather than assuming the
          # module list. An empty list is a finding, not a clean skip: without a
          # config header uvp's discovery would report the install as unknown.
          $header = Join-Path $prefix 'include/uvcpp/uvcpp_config.h'
          if (-not (Test-Path $header)) { throw "the archive has no include/uvcpp/uvcpp_config.h" }
          $modules = Select-String -Path $header -Pattern '^#\s*define\s+(UVCPP_[A-Z0-9_]+)\s+1\b' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($modules.Count -eq 0) { throw "the archive's config header defines no UVCPP_* module" }
          $modules | ForEach-Object { Write-Host "module: $_" }

          # This archive ships pkg-config and no CMake package config, which is the
          # route the generated CMakeLists falls back to.
          $pc = Join-Path $prefix 'lib/pkgconfig/uvcpp.pc'
          if (-not (Test-Path $pc)) { throw "the archive has no lib/pkgconfig/uvcpp.pc" }
          # Ask for the executable image by name. The runner image already carries
          # Strawberry Perl's `pkg-config.bat`, so `Get-Command pkg-config`
          # succeeds there — while CMake's FindPkgConfig searches for
          # `pkg-config.exe`/`pkgconf.exe` and reports
          # `missing: PKG_CONFIG_EXECUTABLE`. That is what the lane's second run
          # showed; the first run failed because the installed directory was not
          # on the next step's PATH at all.
          $pkgConfigExe = Get-Command pkg-config.exe -ErrorAction SilentlyContinue
          if ($null -eq $pkgConfigExe) {
            choco install pkgconfiglite --no-progress -y
            $env:Path = "$env:ProgramData\chocolatey\bin;$env:Path"
            $pkgConfigExe = Get-Command pkg-config.exe -ErrorAction Stop
          }
          # Every later step rebuilds PATH from GITHUB_PATH, so the directory the
          # executable lives in has to be recorded there too. The session PATH above
          # covers this step only.
          $pkgConfig = $pkgConfigExe.Source
          Split-Path -Parent $pkgConfig |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "pkg-config.exe: $pkgConfig"
          & $pkgConfig --version

          # Both are read at different times: `PKG_CONFIG_PATH` by CMake's
          # configure, and `PATH` by the DLL loader when the built service starts.
          # The archive's uvcpp.dll imports libssl/libcrypto/vcruntime from bin/.
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "UVCPP_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile uvp
        run: npm run compile
      - name: Build and run generated workspaces with MSVC
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo ::error title=msvc::vswhere found no Visual Studio installation with the C++ tools
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          where cl
          where cmake
          where pkg-config.exe
          if errorlevel 1 (
            echo ::error title=pkg-config::pkg-config.exe is not on PATH, so the release archive cannot be found
            exit /b 1
          )
          npm run test:toolchain
      - name: Upload toolchain diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-toolchain-lane-${{ matrix.windows-route }}-${{ github.run_attempt }}
          path: .cache/toolchain/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  test-shard:
    name: Test shard (${{ matrix.shard }})
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Download the built runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uvp-test-runtime
          path: .
      - name: Run the built and boundary lanes
        run: npm run test:built -- --reporter=default --reporter=blob --shard=${{ matrix.shard }} --reporter=./scripts/lib/vitest-skipped-reporter.mjs
        env:
          VITEST_BLOB_LABEL: built
      - name: Upload shard reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-built-${{ strategy.job-index }}
          path: .vitest/blob/*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test:
    name: Portable tests
    needs: [changes, test-source, test-shard]
    # Runs whenever the run is not cancelled rather than only when the `code`
    # lane is selected, so that a shard failure still produces a merged report
    # and the coverage artifact — a job whose `needs` failed is skipped under the
    # default `success()`, which is the opposite of what merging is for.
    #
    # Every step that needs a build or a shard report is therefore guarded on
    # `code` individually. Unguarded, they made the job fail on any change that
    # selects no code lane: it downloaded `uvp-test-runtime`, which `build` only
    # uploads when `code` or `package` is selected, and the run went red on a
    # documentation-only commit whose every other lane was correctly skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      # Said out loud, because a job that runs and verifies nothing looks exactly
      # like one that passed. `CI required` accepts a skipped lane, so the honest
      # alternative would be to skip this job — but it cannot, since the merge
      # below has to run when a shard fails.
      - name: Say what this lane is doing
        run: |
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            echo "The code lane was selected; the shard reports below are merged."
          else
            echo "No code lane was selected by this change, so there is nothing to merge."
            echo "The artifact steps below are skipped rather than failing on artifacts never built."
          fi
      - name: Download the built runtime
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uvp-test-runtime
          path: .
      - name: Download the shard reports
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-report-*
          path: .vitest/blob
          merge-multiple: true
      - name: Merge the reports
        if: needs.changes.outputs.code == 'true'
        run: |
          npm exec -- vitest --merge-reports \
            --coverage.enabled --coverage.provider=v8 \
            --coverage.reportsDirectory=coverage \
            --coverage.reporter=text \
            --coverage.reporter=lcov \
            --reporter=default \
            --reporter=junit \
            --reporter=./scripts/lib/vitest-skipped-reporter.mjs \
            --outputFile.junit=test-results.xml
      - name: Require every selected test job to have passed
        if: ${{ !cancelled() }}
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
          SOURCE_RESULT: ${{ needs.test-source.result }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code }}
        run: |
          if [ "${CODE_REQUIRED}" = "true" ]; then
            test "${SHARD_RESULT}" = "success" || exit 1
            test "${SOURCE_RESULT}" = "success" || exit 1
          fi
      - name: Upload merged results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test-results.xml
            coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  toolchain:
    name: Real libuvcpp lane
    needs: [changes, static]
    if: needs.changes.outputs.toolchain == 'true'
    runs-on: ubuntu-latest
    # A cold run builds OpenSSL, libuvcpp with every module, and six template
    # workspaces. libuvcpp gives its own QUIC legs 90 minutes for the same reason;
    # this lane also compiles uvp and the probe, and 75 covers the cold run with
    # room to spare. Every run after the first reads the caches instead.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - name: Install the C++ toolchain
        run: |
          sudo apt-get update
          # libsqlite3-dev is the db module's SQLite backend: the headers to
          # compile against and the .so the generated service links against.
          # Without it that backend is skipped with a warning and the database
          # lane below would run against a libuvcpp that has no store in it.
          #
          # libuv1-dev is libuv itself. libuvcpp prefers a system libuv and
          # otherwise fetches v1.51.0 into its own build tree, and this runner
          # image ships neither libuv1 nor its headers — its package list has no
          # libuv entry at all. The fetched build is linked as a shared library,
          # so the install would carry a `libuv.so.1` dependency that lives in a
          # build directory nothing puts on the loader path, and the failure
          # would land on the first generated service that starts.
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build g++ pkg-config libsqlite3-dev libuv1-dev
      - name: Cache OpenSSL 3.5 with the QUIC API
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openssl-quic
          key: openssl-3.5.0-${{ runner.os }}-${{ runner.arch }}-quic
      - name: Build OpenSSL 3.5.0 from source, for its QUIC API
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # HTTP/3 runs on QUIC, QUIC runs on TLS 1.3, and libuvcpp's QUIC precheck
          # wants an OpenSSL at or above 3.2 with `SSL_set_quic_tls_cbs`. This
          # runner's 3.0.13 is not one: libuvcpp would force QUIC off, then HTTP/3
          # with it, and the h3 template and the probe's h3 half would have nothing
          # to build against. Its own `quic` and `http3` CI legs build OpenSSL from
          # source for this reason; this is that step.
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 --retry-delay 5 -o openssl.tar.gz \
            https://codeload.github.com/openssl/openssl/tar.gz/refs/tags/openssl-3.5.0
          mkdir -p openssl-src
          tar xzf openssl.tar.gz -C openssl-src --strip-components=1
          cd openssl-src
          # `no-tests` skips upstream's own suite, which has nothing to do with the
          # QUIC API and is most of the build time.
          ./Configure --prefix="$HOME/openssl-quic" --libdir=lib shared no-tests
          make -j"$(nproc)"
          make install_sw
          # The binary the build just installed has no RUNPATH, so it needs the
          # prefix on the loader path — and that is also true of anything that links
          # this OpenSSL later, which is why the next step exports it job-wide.
          LD_LIBRARY_PATH="$HOME/openssl-quic/lib" "$HOME/openssl-quic/bin/openssl" version
          # Check the API rather than the version string: a patched 3.0 tree also
          # reports a 3.x version, and it is the configure step's own precheck that
          # would have silently turned QUIC off instead. Match without anchoring the
          # end — the symbol carries a version suffix (`@@OPENSSL_3.5.0`) — and
          # require a defined symbol: `nm -D` prints an undefined reference as
          # `U SSL_set_quic_tls_cbs`, so a name-only match would accept a libssl
          # that only refers to it.
          nm -D "$HOME/openssl-quic/lib/libssl.so" | grep -qE ' [TW] SSL_set_quic_tls_cbs($|@)' || {
            echo "::error title=quic-openssl::the libssl just built has no SSL_set_quic_tls_cbs — this OpenSSL is the wrong one, and every h3 lane behind it would be a silent no-op"
            exit 1
          }
      - name: Put both prefixes on the loader path
        # Two entries, for two different reasons.
        #
        # OpenSSL: everything built below links a libuvcpp that links this OpenSSL,
        # and its soname is `libssl.so.3` — the same soname the runner's own 3.0.13
        # has. A generated service would otherwise resolve the dependency out of
        # `/usr/lib` and the loader would refuse it by version, with
        # `libssl.so.3: version 'OPENSSL_3.5.0' not found (required by
        # .../libuvcpp.so)` — a refusal to start, which reads as a service that
        # will not start rather than as two libraries with one name.
        #
        # libuvcpp: the prebuilt archive's `libuvcpp.so` is self-contained (libc,
        # libstdc++, libm, libgcc), but a source install links libuv, libllhttp,
        # libssl, libcrypto and libsqlite3 dynamically and gives the library no
        # RUNPATH of its own. A binary's RUNPATH is not consulted for its
        # dependencies' dependencies, so the probe's RUNPATH on this prefix finds
        # `libuvcpp.so` and then fails on `libllhttp.so.9.2` — observed locally
        # against exactly this install. The generated services link the same
        # library and need the same entry.
        #
        # `$GITHUB_ENV` rather than a step-level `env:`, which cannot expand
        # `$HOME` — the runner's home is not a constant worth hardcoding.
        run: |
          echo "LD_LIBRARY_PATH=$HOME/openssl-quic/lib:/tmp/uvcpp-prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            >> "$GITHUB_ENV"
      - name: Cache the libuvcpp build
        id: libuvcpp-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/uvcpp-prefix
          # The key names the flag set as well as the version: a change to the
          # configure line below must not be served the previous install, and
          # the install is what the configure line produced.
          key: libuvcpp-1.7.0-${{ runner.os }}-${{ runner.arch }}-gcc-full
      - name: Build and install libuvcpp 1.7.0
        if: steps.libuvcpp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Pin the tag rather than a branch: this lane's claim is about a
          # specific libuvcpp release, and a moving branch would silently change
          # what the claim covers.
          git clone --depth 1 --branch v1.7.0 \
            https://github.com/Antruly/libuvcpp.git /tmp/libuvcpp
          # Every module a template or the probe needs, because each one that is
          # missing turns a lane into a skip rather than into coverage:
          #
          #   - WEB and WEBAPP are what all six templates link against.
          #   - CAPI is the C ABI `uvcpp-probe` reaches libuvcpp through, and it
          #     compiles its h3 translation unit unconditionally, so an install
          #     without HTTP3/QUIC cannot build the probe at all.
          #   - DB defaults to OFF, and without it nothing in CI would ever
          #     exercise the generated service that keeps anything.
          #   - OPENSSL/QUIC/HTTP3 are behind `http3-service` and the probe's QUIC
          #     client. QUIC takes its TLS from the prefix built above.
          cmake -S /tmp/libuvcpp -B /tmp/libuvcpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/uvcpp-prefix \
            -DUVCPP_BUILD_WEB=ON \
            -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_CAPI=ON \
            -DUVCPP_ENABLE_DB=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="$HOME/openssl-quic" \
            -DUVCPP_ENABLE_QUIC=ON \
            -DUVCPP_ENABLE_HTTP3=ON
          cmake --build /tmp/libuvcpp/build --parallel
          cmake --install /tmp/libuvcpp/build
      - name: Record what the install actually provides
        run: |
          set -euo pipefail
          # The lane's premise is that a feature claim must come from the build.
          # Print the evidence rather than assuming the configure flags took, and
          # fail when it is empty: a step that recorded nothing has established
          # nothing.
          header=/tmp/uvcpp-prefix/include/uvcpp/uvcpp_config.h
          test -f "$header"
          # The header indents its defines (`#  define UVCPP_NET_ENABLE 1`), so an
          # anchored `^#define` matches none of them and prints nothing — which
          # reads exactly like a build with no modules enabled.
          grep -E '^#[[:space:]]*define[[:space:]]+UVCPP_[A-Z0-9_]+_ENABLE' "$header"
          # The modules this lane's configure line asks for. A configure line whose
          # flag was overridden by a precheck — QUIC against an OpenSSL without the
          # QUIC API, which is exactly what this runner's own 3.0.13 would do if the
          # build above had not happened — leaves its `-D` in `CMakeCache.txt` and
          # shows up here and nowhere else, as a skip that looks like a host fact.
          for symbol in \
            UVCPP_WEB_ENABLE UVCPP_WEBAPP_ENABLE UVCPP_CAPI_ENABLE UVCPP_DB_ENABLE \
            UVCPP_OPENSSL_ENABLE UVCPP_QUIC_ENABLE UVCPP_HTTP3_ENABLE; do
            grep -qE "^#[[:space:]]*define[[:space:]]+${symbol}[[:space:]]+1\b" "$header" ||
              {
                echo "the configure flags did not take: $symbol is not 1 in $header" >&2
                exit 1
              }
          done
          # Which ways into this install are on disk. The two ways libuvcpp ships
          # are not the same set of files — `cmake --install` writes a CMake
          # package and no uvcpp.pc, the prebuilt release archives are the other
          # way round — so requiring one particular route here would fail this
          # lane over an install the generated project handles. Which route the
          # generated project *took* is not decided here: it is printed by the
          # generated CMakeLists' own `uvp: libuvcpp via ...` line, in the log of
          # the steps that configure the workspaces.
          found=0
          for route in /tmp/uvcpp-prefix/lib/cmake/uvcpp/uvcppConfig.cmake \
            /tmp/uvcpp-prefix/lib/pkgconfig/uvcpp.pc; do
            if [ -f "$route" ]; then
              echo "installed: $route"
              found=1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "the install carries neither a CMake package nor uvcpp.pc" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run compile
      - name: Build the native probe against that libuvcpp
        env:
          CMAKE_PREFIX_PATH: /tmp/uvcpp-prefix
          PKG_CONFIG_PATH: /tmp/uvcpp-prefix/lib/pkgconfig
        run: |
          set -euo pipefail
          # Built here rather than by the lane, for the same reason libuvcpp is:
          # a test that compiled its own C++ would make the lane's runtime depend
          # on a compiler, and its result on a build nobody inspected. Without
          # this step `tests/toolchain/nativeProbe.test.ts` skips, which looks
          # like a host without a probe and is really a missing CI step.
          npm run build:native-probe
      - name: Compile, run, and probe generated workspaces against real libuvcpp
        env:
          CMAKE_PREFIX_PATH: /tmp/uvcpp-prefix
          PKG_CONFIG_PATH: /tmp/uvcpp-prefix/lib/pkgconfig
        run: npm run test:toolchain
      - name: Upload toolchain diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-lane-${{ github.run_attempt }}
          path: .cache/toolchain/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  package-e2e:
    name: Packaged CLI and MCP rehearsal
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Download the built runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uvp-test-runtime
          path: .
      - name: Pack the exact archive that would be published
        run: |
          # npm pack writes the tarball but does not create its destination, and
          # .cache/ is gitignored: in a fresh checkout it does not exist yet.
          mkdir -p .cache
          npm pack --pack-destination .cache
      # Before the install, because a tarball whose bytes depend on where or when
      # it was packed is not the artifact a consumer can check against a source
      # tree. This packs three more times from two places and compares digests.
      - name: Reproduce the archive from its own contents
        run: npm run verify:pack-reproducible
      - name: Install it into an empty prefix, with lifecycle scripts disabled
        run: |
          set -euo pipefail
          mkdir -p .cache/prefix
          npm install --global --prefix "$PWD/.cache/prefix" \
            --ignore-scripts \
            .cache/uvp-agents-*.tgz
      - name: Exercise the CLI from the installed copy
        run: |
          set -euo pipefail
          export PATH="$PWD/.cache/prefix/bin:$PATH"
          # The release checklist reads `uvp --version` to confirm an install, so
          # the tarball's own version is the thing it has to agree with. Checked
          # from outside the process: this is the one place the promise is made
          # to a user, and a stale generated version is invisible from inside.
          expected="uvp-agents $(node -p 'require("./package.json").version')"
          reported="$(uvp --version)"
          if [ "$reported" != "$expected" ]; then
            echo "uvp --version printed '$reported', expected '$expected'"
            exit 1
          fi
          uvp --help
          # The doctor is the one command that must work with no libuvcpp
          # installed, and "works" means it answers. A missing prerequisite is an
          # answer of no, so the documented code is 1 (docs/cli.md: 1 is "the
          # operation ran and the answer is no"), and 2 is the code for a doctor
          # that could not look at all. This step asserted 0 until a run showed
          # it exiting 1 with `libuvcpp: {found: false}` — which is what this
          # runner has, so the expectation was the defect and not the doctor.
          #
          # The code is asserted rather than tolerated: `|| true` would pass just
          # as well on a crash. The report is read, because "exited 1" and
          # "reported the gap" are different claims and only the second is the
          # one this step is here to make.
          doctor_status=0
          uvp doctor --json > .cache/doctor.json || doctor_status=$?
          if [ "$doctor_status" -ne 1 ]; then
            echo "uvp doctor exited $doctor_status; expected 1 on a runner with no libuvcpp"
            exit 1
          fi
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(".cache/doctor.json", "utf8"));
            const found = report.libuvcpp?.found;
            if (found !== false) {
              console.error(`the doctor reported libuvcpp.found = ${JSON.stringify(found)}, and this runner has none`);
              process.exit(1);
            }
            console.log("uvp doctor reports the missing libuvcpp rather than failing on it");
          '
      - name: Exercise the stdio MCP contract from the installed copy
        run: npm run test:packaged-mcp
        env:
          UVP_PACKAGED_BIN: ${{ github.workspace }}/.cache/prefix/bin/uvp

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - run: npm run compile
      - name: Validate generated documentation against the contracts
        run: npm run docs:check
      - name: Generation leaves authored files unchanged
        run: git diff --exit-code
      - run: npm run docs:build

  required:
    name: CI required
    if: ${{ !cancelled() }}
    needs:
      - changes
      - static
      - build
      - test-source
      - windows-source
      - windows-toolchain
      - test-shard
      - test
      - toolchain
      - package-e2e
      - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
          const needs = JSON.parse(process.env.NEEDS ?? "{}");
          const failures = [];
          for (const [name, job] of Object.entries(needs)) {
            if (job.result === "success" || job.result === "skipped") continue;
            failures.push(`${name}: ${job.result}`);
          }
          if (failures.length > 0) {
            console.error("Selected lanes did not pass:\n" + failures.join("\n"));
            process.exit(1);
          }
          console.log("Every selected lane passed. Skipped lanes were not selected by this change.");
          '
