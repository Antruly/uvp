name: Documentation build

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/contracts/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # ./.github/actions/npm-cache owns the npm download cache, and saves it
          # only from trusted default-branch events. setup-node v5 caches it by
          # itself whenever package.json declares a packageManager.
          package-manager-cache: false
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - run: npm run compile
      - name: Regenerate the derived documentation inputs
        run: npm run docs:generate
      - run: npm run docs:build
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: docs/.vitepress/dist/
          if-no-files-found: error
          retention-days: 7
