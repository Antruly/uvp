name: Release please

# Opens and updates the release PR on `main`. It never edits a version or a tag
# by hand: release-please computes both from the conventional commits, and the
# tag is created when the release PR merges.
#
# Scope decision (Option B), recorded on #160:
# https://github.com/Antruly/uvp/issues/160#issuecomment-6233157938
#
# This workflow does **not** push to the release PR branch. `sbom.cdx.json`
# carries the version in two compound strings that `extra-files` cannot rewrite,
# so its regeneration stays a maintainer step: after the bump, a maintainer runs
# `npm run docs:generate` and commits the result to the release PR. If CI runs on
# that PR, it is expected to be red on `docs:check` until that commit, and a
# `GITHUB_TOKEN`-opened PR may carry no check runs at all (see `docs/releasing.md`).
# This workflow does not claim either head is green.
#
# There is no tag and no `bootstrap-sha`, so release-please's documented first-run
# behaviour reads the whole branch history: the first release PR's changelog will
# cover all of it unless the maintainer records a different choice on #160.
#
# When release-please creates a release, the second job calls the GitHub Packages
# mirror workflow with the new tag. That mirror uses the workflow's own
# `GITHUB_TOKEN` and `packages: write`, so it follows the release automatically.
# npmjs is deliberately not automated here: `publish.yml` stays a manual dispatch
# because trusted publishing is npm's mechanism.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update the release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # The release-please action needs to write the release branch, the release
    # PR, and the labels it puts on that PR. Nothing else in this repository
    # takes write access beyond the job that needs it.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-github-packages:
    name: Publish the GitHub Packages mirror
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
