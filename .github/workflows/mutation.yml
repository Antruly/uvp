name: Mutation sweep

# Mutation testing is slow by nature and its value is in reading the survivors,
# not in gating a merge. It runs on a schedule and on demand, never on a pull
# request — a PR that fails on a mutation score invites editing the score.

on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  mutation:
    name: Mutation sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        uses: ./.github/actions/npm-cache
      - run: npm ci
      - name: Preflight the configuration
        run: npx --no-install stryker run --dryRunOnly
      - name: Run the sweep
        run: npx --no-install stryker run
      - name: Require both reports from the completed sweep
        run: |
          test -s reports/mutation/uvp.json
          test -s reports/mutation/uvp.html
      - name: Summarize survivors
        run: node scripts/ci/mutation-summary.mjs
      - name: Retain the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ github.run_attempt }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
